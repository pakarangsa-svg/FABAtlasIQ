<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RD Food Chain — Food Cost Management</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#f1f5f9;
    --line:#e2e8f0; --line2:#edf2f7;
    --txt:#1e293b; --mut:#475569; --mut2:#94a3b8;
    --brand:#f0a500; --brand-d:#c98a00;
    --green:#27c093; --red:#f5544e; --blue:#4c8dff; --purple:#9b7bff;
    --chip:#e8edf4;
    --radius:12px;
    --sidebar:236px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",Tahoma,"Sarabun",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--txt); font-size:14px; line-height:1.45;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#c8d4e0;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* layout */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .sidebar{
    background:linear-gradient(160deg,#4338ca 0%,#7c3aed 48%,#be1a1a 100%);
    border-right:none; padding:18px 14px; position:sticky; top:0; height:100vh;
    display:flex;flex-direction:column;gap:6px;
    box-shadow:4px 0 28px rgba(67,56,202,.22);
  }
  .logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .logo .mark{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;letter-spacing:-.3px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    overflow:hidden;
  }
  .logo .mark img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .logo b{font-size:15px;letter-spacing:.3px;display:block;color:#fff}
  .logo span{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.5px}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.5);padding:14px 10px 6px}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    color:rgba(255,255,255,.78);cursor:pointer;font-weight:600;font-size:13.5px;transition:.12s;
  }
  .nav-item .ic{width:18px;text-align:center;font-size:15px}
  .nav-item:hover{background:rgba(255,255,255,.15);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 3px 0 0 rgba(255,255,255,.85)}
  .sidebar-foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.5);padding:10px;border-top:1px solid rgba(255,255,255,.15)}

  /* main */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 26px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:17px;margin:0;font-weight:700}
  .topbar .sub{color:var(--mut2);font-size:12px;margin-top:2px}
  .spacer{flex:1}
  .brand-select{display:flex;align-items:center;gap:8px}
  .brand-select label{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px}
  select,input,textarea{
    background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
    border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--brand)}
  select{cursor:pointer}
  .content{padding:24px 26px 60px;max-width:1280px;width:100%}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--txt);padding:9px 14px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;transition:.12s;
  }
  .btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(76,141,255,.07)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn.danger{color:var(--red);border-color:rgba(245,84,78,.3)}
  .btn.danger:hover{background:rgba(245,84,78,.08)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.ghost{background:transparent}
  .icon-btn{background:transparent;border:none;color:var(--mut);cursor:pointer;padding:5px 7px;border-radius:7px;font-size:14px}
  .icon-btn:hover{background:var(--line);color:var(--txt)}

  /* cards / grid */
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2)}
  .stat .v{font-size:26px;font-weight:800;margin-top:6px}
  .stat .d{font-size:12px;color:var(--mut);margin-top:4px}
  .stat .ic{float:right;font-size:20px;opacity:.5}

  .section-title{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
  .section-title h2{font-size:15px;margin:0;font-weight:700}
  .section-title .count{font-size:12px;color:var(--mut2);background:var(--chip);padding:2px 9px;border-radius:20px}

  /* table */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--mut2);background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
  }
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--mut2)}
  .mono{font-variant-numeric:tabular-nums}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--mut)}
  .chip.green{background:rgba(39,192,147,.14);color:var(--green)}
  .chip.red{background:rgba(245,84,78,.14);color:var(--red)}
  .chip.amber{background:rgba(240,165,0,.16);color:var(--brand)}
  .chip.blue{background:rgba(76,141,255,.16);color:var(--blue)}
  .chip.purple{background:rgba(155,123,255,.16);color:var(--purple)}
  .chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  .empty{padding:50px 20px;text-align:center;color:var(--mut2)}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.6}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .search{flex:1;min-width:200px;max-width:360px}
  .toolbar input.search{width:100%}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(5,10,22,.66);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
  .modal-back.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:720px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .15s ease}
  .modal.wide{max-width:900px}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:20px 22px;max-height:70vh;overflow:auto}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.one{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--mut);font-weight:600}
  .field .hint{font-size:11px;color:var(--mut2)}
  .field input,.field select,.field textarea{width:100%}

  .line-items{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
  .li-head,.li-row{display:grid;grid-template-columns:1fr 90px 80px 110px 36px;gap:8px;align-items:center;padding:8px 10px}
  .li-head{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut2)}
  .li-row{border-top:1px solid var(--line)}
  .li-row select,.li-row input{padding:7px 9px;font-size:12.5px}
  .li-row .cost{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}

  .summary-box{display:flex;gap:18px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:14px 18px;margin-top:16px}
  .summary-box .s{flex:1;min-width:120px}
  .summary-box .s .k{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}
  .summary-box .s .v{font-size:20px;font-weight:800;margin-top:3px}

  .pill-row{display:flex;gap:6px;flex-wrap:wrap}
  .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:4px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#fff;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:.25s;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.15)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-left:3px solid var(--green)}
  .toast.err{border-left:3px solid var(--red)}

  .brand-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .help{font-size:12px;color:var(--mut2);margin-top:4px}
  .link-btn{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px}
  .link-btn:hover{text-decoration:underline}
  .kpi-good{color:var(--green)} .kpi-warn{color:var(--brand)} .kpi-bad{color:var(--red)}

  /* ---- Timeline wrapper (layout only — vars now match root) ---- */
  .tl-light-wrap{
    min-height:calc(100vh - 120px);
    margin:-24px -26px -60px;
    padding:24px 26px 60px;
    background:var(--bg);
  }
  @media(max-width:820px){
    .tl-light-wrap{margin:-14px -12px -60px;padding:14px 12px 60px}
  }

  /* ---- NPD KPI sub-tabs ---- */
  .npd-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
  .npd-tabs::-webkit-scrollbar{display:none}
  .npd-tab{padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;border-radius:6px 6px 0 0}
  .npd-tab:hover{color:var(--txt);background:var(--panel2)}
  .npd-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .npd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .npd-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .npd-tile .nt-lbl{font-size:10px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em}
  .npd-tile .nt-val{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
  .npd-tile .nt-sub{font-size:11px;color:var(--mut2);margin-top:3px}
  .npd-charts{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:18px}
  @media(max-width:820px){.npd-charts{grid-template-columns:1fr}}
  .npd-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .npd-card-title{font-size:13px;font-weight:700;margin-bottom:2px}
  .npd-card-sub{font-size:11px;color:var(--mut2);margin-bottom:12px}
  /* horizontal bar chart */
  .nhbar-row{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:8px;margin-bottom:8px}
  .nhbar-lbl{font-size:11px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nhbar-track{height:16px;display:flex;gap:1px;border-radius:4px;overflow:hidden}
  .nhbar-seg{min-width:3px}
  .nhbar-total{font-size:11px;font-weight:700;color:var(--mut);text-align:right}
  /* monthly column chart */
  .npd-col-wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;padding-top:4px}
  .npd-col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .npd-col .seg{border-radius:3px 3px 0 0;min-height:0;transition:opacity .15s}
  .npd-col:hover .seg{opacity:.65}
  .npd-col-axis{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:4px;border-top:1px solid var(--line2);padding-top:4px}
  .npd-col-axis span{font-size:9px;color:var(--mut2);text-align:center}
  /* brand cards */
  .npd-brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
  .npd-brand-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left;width:100%;border-top:3px solid var(--pc,var(--blue))}
  .npd-brand-card:hover{border-color:var(--mut);transform:translateY(-1px)}
  .nbc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .nbc-swatch{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;overflow:hidden}
  .nbc-swatch img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:7px;padding:2px}
  .nbc-name{font-size:13px;font-weight:700;line-height:1.2}
  .nbc-count{font-size:10px;color:var(--mut2)}
  .nbc-stats{display:flex;gap:12px;margin-bottom:8px}
  .nbc-stat b{display:block;font-size:14px;font-weight:750}
  .nbc-stat span{font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.04em}
  /* project cards */
  .npd-proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .npd-proj-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:3px solid var(--pc,var(--blue))}
  .npc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
  .npc-title{font-size:13px;font-weight:700;line-height:1.25}
  .npc-desc{font-size:11px;color:var(--mut);line-height:1.45;margin:5px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .npc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mut2);margin-bottom:10px}
  .npc-meta b{color:var(--mut);font-weight:600}
  .npd-prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
  .npd-prog i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
  .npd-ms-list{display:flex;flex-direction:column;gap:3px;margin-top:8px}
  .npd-ms-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);padding:2px 5px;border-radius:5px;cursor:pointer;user-select:none}
  .npd-ms-item:hover{background:var(--panel2)}
  .npd-ms-item .mbox{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:3px;flex:none;display:grid;place-items:center;font-size:9px}
  .npd-ms-item.done .mbox{background:var(--green);border-color:var(--green);color:#fff}
  .npd-ms-item.done{color:var(--mut2)}
  .npd-ms-item.done .mname{text-decoration:line-through}
  .npd-ms-item .mname{flex:1;min-width:0}
  .npd-ms-dept{flex:none;font-size:9px;font-weight:700;color:var(--mut2);background:var(--panel2);border-radius:999px;padding:1px 6px;white-space:nowrap}
  .npd-ms-due{flex:none;font-size:9px;color:var(--mut2);white-space:nowrap}
  .npd-ms-due.overdue{color:var(--red);font-weight:700}
  .npd-img-thumb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .npd-img-thumb img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
  .npd-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
  /* status chips for NPD */
  .nchip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
  .nchip.planning{color:var(--mut);background:rgba(137,135,129,.14)}
  .nchip.inprogress{color:var(--blue);background:rgba(76,141,255,.14)}
  .nchip.launched{color:var(--green);background:rgba(39,192,147,.14)}
  .nchip.completed{color:#fff;background:var(--green)}
  .nchip.delayed{color:var(--red);background:rgba(245,84,78,.14)}
  .nchip.onhold{color:var(--brand);background:rgba(240,165,0,.14)}
  /* NPD legend */
  .npd-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--mut2)}
  .npd-legend .li{display:inline-flex;align-items:center;gap:5px}
  .npd-legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
  /* NPD projects table */
  .npd-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .npd-tbl-wrap table{width:100%;border-collapse:collapse;min-width:800px}
  .npd-tbl-wrap th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);padding:10px 12px;border-bottom:1px solid var(--line)}
  .npd-tbl-wrap td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .npd-tbl-wrap tr:last-child td{border-bottom:none}
  .npd-tbl-wrap tbody tr:hover{background:var(--panel2)}
  /* NPD toolbar */
  .npd-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .npd-search{flex:1;min-width:160px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px}
  .npd-search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--txt)}
  .npd-toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:600;outline:none;cursor:pointer}
  /* NPD brand pills */
  .npd-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .npd-pills::-webkit-scrollbar{display:none}
  .npd-pill{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
  .npd-pill:hover{border-color:var(--mut);color:var(--txt)}
  .npd-pill.active{background:var(--txt);color:var(--bg);border-color:var(--txt)}
  .npd-dot{width:7px;height:7px;border-radius:50%}

  /* ---- Timeline / Gantt ---- */
  .tl-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tl-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
  .tl-pill:hover{background:var(--panel2);color:var(--txt)}
  .tl-pill.active{background:var(--brand);border-color:var(--brand);color:#000}
  .tl-pill .dot{width:7px;height:7px;border-radius:50%}
  .gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}

/* =========================================================================
   COST ENGINE
   ========================================================================= */
function getMaterial(id){ return DATA.materials.find(x=>x.id===id); }
function getBom(id){ return DATA.boms.find(x=>x.id===id); }

// cost per recipe-unit of a raw material (yield-adjusted effective cost)
function rmCostPerUnit(m){
  if(!m || !m.purchaseQty) return 0;
  const base = m.purchasePrice / m.purchaseQty;        // per recipe unit
  const y = (m.yieldPercent && m.yieldPercent>0) ? m.yieldPercent : 1;
  return base / y;                                     // effective cost
}

// total cost to produce a whole BOM batch (recursive, cycle-safe)
function bomBatchCost(bom, stack){
  if(!bom) return 0;
  stack = stack || [];
  if(stack.includes(bom.id)) return 0;                 // cycle guard
  const ns = stack.concat(bom.id);
  let total = 0;
  for(const it of (bom.items||[])){
    total += lineCost(it, ns);
  }
  return total;
}
// cost per OUTPUT unit of a BOM (yield-adjusted)
function bomCostPerUnit(bom, stack){
  if(!bom || !bom.outputQty) return 0;
  const y = (bom.yieldPercent && bom.yieldPercent>0) ? bom.yieldPercent : 1;
  return bomBatchCost(bom, stack) / (bom.outputQty * y);
}
// cost of a single line item (qty * unitcost of its reference)
function lineCost(it, stack){
  if(!it) return 0;
  if(it.type==="rm"){
    const m = getMaterial(it.ref);
    return (it.qty||0) * rmCostPerUnit(m);
  }else{
    const b = getBom(it.ref);
    return (it.qty||0) * bomCostPerUnit(b, stack);
  }
}
function menuCost(menu){
  let t=0; for(const it of (menu.items||[])) t += lineCost(it);
  return t;
}
function menuMetrics(menu){
  const cost = menuCost(menu);
  const sp = menu.sellingPrice||0;
  const pct = sp>0 ? cost/sp*100 : 0;
  const gp = sp - cost;
  const gpPct = sp>0 ? gp/sp*100 : 0;
  return {cost, sp, pct, gp, gpPct};
}

/* =========================================================================

   ========================================================================= */
function baht(n){ return (n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(n,d){ return (n||0).toLocaleString("th-TH",{minimumFractionDigits:d??0,maximumFractionDigits:d??2}); }
function pct(n){ return (n||0).toFixed(1)+"%"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function brandOf(id){ return BRANDS.find(b=>b.id===id); }

}
function pctClass(p,target){
  const t = target||35;
  if(p<=t) return "kpi-good";
  if(p<=t+5) return "kpi-warn";
  return "kpi-bad";
}
function pctChip(p,target){
  const t=target||35;
  let cls="green"; if(p>t&&p<=t+5)cls="amber"; else if(p>t+5)cls="red";
  return `<span class="chip ${cls}">${pct(p)}</span>`;
}
function toast(msg,type){
  const t=document.getElementById("toast");

  clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2200);
}

/* current brand filter helpers */

   APP / ROUTER

  },

  importData(file){

  }
};

function viewHome(){
  const menus=fMenus();
  const totalMenus=menus.length;
  const avgPct = menus.length ? menus.reduce((s,m)=>s+menuMetrics(m).pct,0)/menus.length : 0;
  const overTarget = menus.filter(m=>{ const x=menuMetrics(m); return x.pct>brandCogTarget(m.brandId); }).length;
  const rmCount=DATA.materials.length, bomCount=fBoms().length, prjCount=fProjects().length;
  const activeBrand = DATA.activeBrand;
  const avgTarget = activeBrand!=='all' ? brandCogTarget(activeBrand) : 35;

  // per-brand summary (shown when all brands)
  const perBrand = BRANDS.map(b=>{
    const ms=DATA.menus.filter(m=>m.brandId===b.id);
    const avg = ms.length? ms.reduce((s,m)=>s+menuMetrics(m).pct,0)/ms.length : null;
    return {b, count:ms.length, avg};
  });

  // per-category summary (shown when specific brand selected)
  const catMap={};
  menus.forEach(m=>{ const c=m.category||'ทั่วไป'; (catMap[c]=catMap[c]||[]).push(m); });
  const perCat = Object.entries(catMap).map(([name,ms])=>({
    name, count:ms.length,
    avg: ms.reduce((s,m)=>s+menuMetrics(m).pct,0)/ms.length
  })).sort((a,b)=>b.avg-a.avg);

  // top %COG menus
  const ranked = menus.map(m=>({m,x:menuMetrics(m)})).sort((a,b)=>b.x.pct-a.x.pct).slice(0,6);

  return `
  <div class="grid cards" style="margin-bottom:22px">
    ${stat("เมนูทั้งหมด", totalMenus, "📊", "รายการในระบบ")}
    ${stat("%COG เฉลี่ย", pct(avgPct), "🎯", avgPct<=avgTarget?'<span class="kpi-good">อยู่ในเกณฑ์</span>':'<span class="kpi-bad">สูงกว่าเป้า</span>')}
    <div class="card stat" style="position:relative">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <span class="ic">⚠️</span>
        <button class="icon-btn" onclick="openCogTargetSettings()" title="ตั้งค่าเป้า %COG" style="font-size:13px">⚙️</button>
      </div>
      <div class="k">จำนวนเมนู %COG สูงเกินเป้า</div>
      <div class="v">${overTarget}</div>
      <div class="d">${overTarget?'<span class="kpi-bad">ต้องทบทวน</span>':'<span class="kpi-good">ไม่มี</span>'}</div>
    </div>
    ${stat("วัตถุดิบ (RM)", rmCount, "🥩", bomCount+" สูตร BOM · "+prjCount+" โปรเจกต์")}
  </div>

  <div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start">
    <div>
      <div class="section-title"><h2>เมนู %COG สูงสุด</h2><span class="count">${ranked.length}</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>เมนู</th><th>แบรนด์</th><th class="num">ราคาขาย (Ex-Vat)</th><th class="num">ต้นทุน (บาท)</th><th class="num">%COG</th></tr></thead>
          <tbody>
          ${ranked.length? ranked.map(({m,x})=>`
            <tr style="cursor:pointer" onclick="App.go('foodcost')">
              <td><b>${esc(m.name)}</b><div class="muted" style="font-size:11px">${esc(m.code||"")}</div></td>
              <td>${brandTag(m.brandId)}</td>
              <td class="num mono">${baht(x.sp)}</td>
              <td class="num mono">${baht(x.cost)}</td>
              <td class="num">${pctChip(x.pct,brandCogTarget(m.brandId))}</td>
            </tr>`).join("")
          : `<tr><td colspan="5"><div class="empty"><div class="big">🍽️</div>ยังไม่มีเมนู — เพิ่มที่หน้า Food Cost</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div>
      ${activeBrand!=='all' ? `
        <div class="section-title"><h2>สรุปตามหมวดเมนู</h2><span class="count">${perCat.length}</span></div>
        <div class="card" style="padding:8px">
          ${perCat.length ? perCat.map(c=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)">
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:13px">${esc(c.name)}</div>
                <div class="muted" style="font-size:11px">${c.count} เมนู</div>
              </div>
              <div style="text-align:right">
                <span class="${pctClass(c.avg,avgTarget)}" style="font-weight:700">${pct(c.avg)}</span>
                <div class="muted" style="font-size:10px">เฉลี่ย</div>
              </div>
            </div>`).join("") : '<div class="empty" style="padding:20px">ยังไม่มีเมนูในแบรนด์นี้</div>'}
        </div>
      ` : `
        <div class="section-title"><h2>สรุปตามแบรนด์</h2><span class="count">${BRANDS.length}</span></div>
        <div class="card" style="padding:8px">
          ${perBrand.map(p=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)">
              ${p.b.logo
                ? `<img src="${p.b.logo}" alt="${esc(p.b.short)}" style="width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex:none" onerror="this.outerHTML='<span class=brand-dot style=background:${p.b.color};width:11px;height:11px></span>'">`
                : `<span class="brand-dot" style="background:${p.b.color};width:11px;height:11px"></span>`}
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:13px">${esc(p.b.short)}</div>
                <div class="muted" style="font-size:11px">${p.count} เมนู · เป้า ${brandCogTarget(p.b.id)}%</div>
              </div>
              <div style="text-align:right">
                ${p.avg!=null?`<span class="${pctClass(p.avg,brandCogTarget(p.b.id))}" style="font-weight:700">${pct(p.avg)}</span>`:'<span class="muted">—</span>'}
                <div class="muted" style="font-size:10px">เฉลี่ย</div>
              </div>
            </div>`).join("")}
        </div>
      `}
    </div>
  </div>`;
}

function delMenu(id){
  if(!confirmDel()) return;
  DATA.menus=DATA.menus.filter(m=>m.id!==id); save(); render(); toast("ลบเมนูแล้ว");
}
function editMenu(id){
  const isNew=!id;
  const m = id ? JSON.parse(JSON.stringify(getMenuById(id))) : {
    id:uid("menu"), brandId:(DATA.activeBrand!=="all"?DATA.activeBrand:BRANDS[0].id),
    projectId:"", code:nextCode("M",DATA.menus), name:"", sellingPrice:0, targetPct:35, active:true, items:[]
  };
  openModal({
    title:isNew?"เพิ่มเมนู (Food Cost)":"แก้ไขเมนู",
    wide:true,
    body: menuForm(m),
    onSave:()=>{
      collectMenu(m);
      if(!m.name.trim()){ toast("กรุณาใส่ชื่อเมนู","err"); return false; }
      const idx=DATA.menus.findIndex(x=>x.id===m.id);
      if(idx>=0) DATA.menus[idx]=m; else DATA.menus.push(m);
      save(); render(); toast("บันทึกเมนูแล้ว"); return true;
    }
  });
  refreshMenuCalc(m);
}
function getMenuById(id){ return DATA.menus.find(m=>m.id===id); }

    <div class="field"><label>เป้า Food Cost (%)</label><input id="f_target" type="number" min="0" step="0.1" value="${m.targetPct||35}" oninput="refreshMenuCalc(window.__m)"/></div>

window.__m=null;
function refreshMenuCalc(m){
  window.__m=m; collectMenu(m,true);

  if(!box) return;
  const barColor = x.pct<=(m.targetPct||35)?'var(--green)':(x.pct<=(m.targetPct||35)+5?'var(--brand)':'var(--red)');
  box.innerHTML=`
  <div class="summary-box">
    <div class="s"><div class="k">ต้นทุนรวม</div><div class="v mono">฿${baht(x.cost)}</div></div>
    <div class="s"><div class="k">ราคาขาย</div><div class="v mono">฿${baht(x.sp)}</div></div>
    <div class="s"><div class="k">Food Cost</div><div class="v" style="color:${barColor}">${pct(x.pct)}</div>
      <div class="bar"><i style="width:${Math.min(100,x.pct)}%;background:${barColor}"></i></div></div>
    <div class="s"><div class="k">กำไรขั้นต้น</div><div class="v mono ${x.gp<0?'kpi-bad':'kpi-good'}">฿${baht(x.gp)}</div>

  </div>`;
}
function collectMenu(m,calcOnly){
  const g=id=>document.getElementById(id);
  if(g("f_price")) m.sellingPrice=parseFloat(g("f_price").value)||0;
  if(g("f_target")) m.targetPct=parseFloat(g("f_target").value)||0;
  collectLineItems(m);
  if(calcOnly) return;
  m.name=(g("f_name")?.value||"").trim();
  m.code=g("f_code")?.value||"";
  m.brandId=g("f_brand")?.value||m.brandId;
  m.projectId=g("f_project")?.value||"";
  m.category=(g("f_category")?.value||"").trim();
}

/* =========================================================================
   SHARED: line-items editor (used by Menu & BOM)
   ========================================================================= */
function lineItemsEditor(obj,kind){
  const rows=(obj.items||[]).map((it,i)=>lineRow(it,i,kind)).join("");
  return `
  <div class="line-items" id="liWrap">
    <div class="li-head"><div>วัตถุดิบ / สูตร</div><div>จำนวน</div><div>หน่วย</div><div style="text-align:right">ต้นทุน</div><div></div></div>
    <div id="liRows">${rows||""}</div>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="btn sm" onclick="addLine('rm','${kind}')">＋ วัตถุดิบ (RM)</button>
    <button class="btn sm" onclick="addLine('bom','${kind}')">＋ สูตร BOM</button>
  </div>`;
}
function lineRow(it,i,kind){
  const opts = it.type==="rm" ? rmOptions(it.ref) : bomOptions(it.ref);
  const c = lineCost(it);
  return `
  <div class="li-row" data-i="${i}">
    <select onchange="lineChanged(${i},'ref',this.value,'${kind}')">${opts}</select>
    <input type="number" min="0" step="any" value="${it.qty||0}" onchange="lineChanged(${i},'qty',this.value,'${kind}')" oninput="lineChanged(${i},'qty',this.value,'${kind}',true)"/>
    <input value="${esc(it.unit||"")}" onchange="lineChanged(${i},'unit',this.value,'${kind}')" placeholder="หน่วย"/>
    <div class="cost">฿${baht(c)}</div>
    <button class="icon-btn" onclick="delLine(${i},'${kind}')">✕</button>
  </div>`;
}
function rmOptions(sel){
  return `<option value="">— เลือกวัตถุดิบ —</option>`+
    DATA.materials.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)} (${esc(m.unit)})</option>`).join("");
}
function bomOptions(sel){
  return `<option value="">— เลือกสูตร BOM —</option>`+
    DATA.boms.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)} (/${esc(b.outputUnit)})</option>`).join("");
}
function curObj(kind){ return kind==="menu"?window.__m:window.__b; }
function addLine(type,kind){
  const o=curObj(kind); o.items=o.items||[];
  o.items.push({type, ref:"", qty:0, unit:type==="rm"?"g":"ml"});
  rerenderLines(kind);
}
function delLine(i,kind){ const o=curObj(kind); o.items.splice(i,1); rerenderLines(kind); }
function lineChanged(i,field,val,kind,silent){
  const o=curObj(kind); const it=o.items[i]; if(!it) return;
  if(field==="qty") it.qty=parseFloat(val)||0;
  else if(field==="ref"){
    it.ref=val;
    // auto-fill unit from reference
    if(it.type==="rm"){ const m=getMaterial(val); if(m) it.unit=m.unit; }
    else { const b=getBom(val); if(b) it.unit=b.outputUnit; }
  }
  else it[field]=val;
  if(field==="ref") rerenderLines(kind);
  else updateLineCosts(kind);
}
function rerenderLines(kind){
  const o=curObj(kind);
  document.getElementById("liRows").innerHTML=(o.items||[]).map((it,i)=>lineRow(it,i,kind)).join("");
  if(kind==="menu") refreshMenuCalc(o); else refreshBomCalc(o);
}
function updateLineCosts(kind){
  const o=curObj(kind);
  document.querySelectorAll("#liRows .li-row").forEach(row=>{
    const i=+row.dataset.i; const c=lineCost(o.items[i]);
    row.querySelector(".cost").textContent="฿"+baht(c);
  });
  if(kind==="menu") refreshMenuCalc(o); else refreshBomCalc(o);
}
function collectLineItems(o){ /* items already kept in sync via lineChanged */ }

function delBom(id){
  const used=DATA.menus.some(m=>(m.items||[]).some(i=>i.type==="bom"&&i.ref===id))
    || DATA.boms.some(b=>(b.items||[]).some(i=>i.type==="bom"&&i.ref===id));
  if(used && !confirm("สูตรนี้ถูกใช้งานในเมนู/สูตรอื่นอยู่ — ยืนยันการลบ?")) return;
  if(!used && !confirmDel()) return;
  DATA.boms=DATA.boms.filter(b=>b.id!==id); save(); render(); toast("ลบสูตรแล้ว");
}

function refreshBomCalc(b){
  collectBom(b,true);
  const batch=bomBatchCost(b), per=bomCostPerUnit(b);
  const box=document.getElementById("bomCalc"); if(!box) return;
  box.innerHTML=`
  <div class="summary-box">
    <div class="s"><div class="k">ต้นทุนทั้ง Batch</div><div class="v mono">฿${baht(batch)}</div></div>
    <div class="s"><div class="k">ผลผลิตสุทธิ</div><div class="v mono">${num(b.outputQty*(b.yieldPercent||1),0)} ${esc(b.outputUnit)}</div>
      <div class="muted" style="font-size:11px">${num(b.outputQty,0)} × yield ${pct((b.yieldPercent||1)*100)}</div></div>
    <div class="s"><div class="k">ต้นทุนต่อหน่วย</div><div class="v mono kpi-warn">฿${baht(per)}<span style="font-size:12px;color:var(--mut2)">/${esc(b.outputUnit)}</span></div></div>
  </div>`;
}
function collectBom(b,calcOnly){
  const g=id=>document.getElementById(id);
  if(g("b_oq")) b.outputQty=parseFloat(g("b_oq").value)||0;
  if(g("b_ou")) b.outputUnit=g("b_ou").value;
  if(g("b_yield")) b.yieldPercent=(parseFloat(g("b_yield").value)||100)/100;
  if(calcOnly) return;
  b.name=(g("b_name")?.value||"").trim();
  b.code=g("b_code")?.value||"";
  b.brandId=g("b_brand")?.value||b.brandId;
  b.notes=g("b_notes")?.value||"";
}
function saveBom(){
  const b=window.__b; collectBom(b);
  if(!b.name){ toast("กรุณาใส่ชื่อสูตร","err"); return; }
  const idx=DATA.boms.findIndex(x=>x.id===b.id);
  if(idx>=0) DATA.boms[idx]=b; else DATA.boms.push(b);
  save(); toast("บันทึกสูตรแล้ว"); render(); setTimeout(()=>openBomEditor(b.id),0);
}
function delBomFromEditor(id,isNew){
  if(isNew){ render(); return; }
  if(!confirmDel("ลบสูตรนี้?")) return;
  DATA.boms=DATA.boms.filter(b=>b.id!==id); save(); render(); toast("ลบสูตรแล้ว");
}

const NPD_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const NPD_STATUSES = [
  { id:"planning",   label:"Planning",    ico:"⏳" },
  { id:"inprogress", label:"In Progress", ico:"🔄" },
  { id:"launched",   label:"Launched",    ico:"🚀" },
  { id:"completed",  label:"Completed",   ico:"✅" },
  { id:"delayed",    label:"Delayed",     ico:"⚠️" },
  { id:"onhold",     label:"On Hold",     ico:"⏸" },
];
const NPD_DEFAULT_MS = [
  { name:"Concept & theme approved", dept:"R&D",        done:false, dueDate:"" },
  { name:"Recipe development",       dept:"R&D",        done:false, dueDate:"" },
  { name:"Internal tasting",         dept:"QA/R&D",     done:false, dueDate:"" },
  { name:"Costing approved",         dept:"Finance",    done:false, dueDate:"" },
  { name:"Marketing materials",      dept:"Marketing",  done:false, dueDate:"" },
  { name:"Store rollout / launch",   dept:"Operations", done:false, dueDate:"" },
];
const NPD_ST_COLS = {
  planning:"var(--mut2)", inprogress:"var(--blue)", launched:"var(--green)",
  completed:"#006300", delayed:"var(--red)", onhold:"var(--brand)"
};

let npdSub = "dashboard";
let npdYear = new Date().getFullYear();
let npdBrand = "";
let npdSearch = "";
let npdFStatus = "";
let npdEditBrand = BRANDS[0].id;
const npdExpanded = new Set();
function npdToggleExpand(e, pid){
  e.stopPropagation();
  npdExpanded.has(pid) ? npdExpanded.delete(pid) : npdExpanded.add(pid);
  const rows=document.getElementById('gms_'+pid);
  if(rows) rows.style.display=npdExpanded.has(pid)?'block':'none';
  e.currentTarget.textContent=npdExpanded.has(pid)?'▼':'▶';
}

function npdYearProjects(){
  return (DATA.npd||[]).filter(p=>{
    const sy = +p.launchStart.slice(0,4);
    const ey = p.launchEnd ? +p.launchEnd.slice(0,4) : 9999;
    return sy<=npdYear && ey>=npdYear;
  });
}
function npdAch(p){ return p.milestones&&p.milestones.length ? Math.round(100*p.milestones.filter(m=>m.done).length/p.milestones.length) : 0; }
function npdBrandOf(id){ return BRANDS.find(b=>b.id===id)||BRANDS[0]; }
function npdStatusOf(id){ return NPD_STATUSES.find(s=>s.id===id)||NPD_STATUSES[0]; }
function toDateStr(s){ return !s ? "" : s.length===7 ? s+"-01" : s; }
function fmtDue(d){ if(!d) return ""; const [y,m,day]=d.split("-"); return (day?day+" ":"")+NPD_MONTHS[+m-1]+" "+y; }
function isDueOver(d){ return d && !this.done && d < new Date().toISOString().slice(0,10); }
function npdFmtWin(p){
  const sm = +p.launchStart.slice(5,7)-1, sy = +p.launchStart.slice(0,4);
  const s = NPD_MONTHS[sm]+" "+sy;
  if(!p.launchEnd) return s+" →";
  const em = +p.launchEnd.slice(5,7)-1, ey = +p.launchEnd.slice(0,4);
  const e = NPD_MONTHS[em]+" "+ey;
  return s===e ? s : s+" → "+e;
}
function npdOnTime(p){ return p.actualLaunch && p.actualLaunch<=p.launchStart; }

function npdStatusChip(st){
  const s=npdStatusOf(st);
  return `<span class="nchip ${st}">${s.ico} ${s.label}</span>`;
}

function viewTimeline(){
  const tabs=[
    {id:"dashboard",label:"📊 Dashboard"},
    {id:"brands",   label:"🏪 Brands"},
    {id:"gantt",    label:"📅 Gantt"},
    {id:"projects", label:"📋 Projects"},
  ];
  const tabsHtml = `<div class="npd-tabs">
    ${tabs.map(t=>`<button class="npd-tab ${t.id===npdSub?'active':''}" onclick="npdSub='${t.id}';render()">${t.label}</button>`).join('')}
    <div style="flex:1"></div>
    <select style="background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;margin-bottom:4px;align-self:flex-end" onchange="npdYear=+this.value;render()">
      ${[...new Set((DATA.npd||[]).flatMap(p=>[+p.launchStart.slice(0,4),+(p.launchEnd||p.launchStart).slice(0,4)]).concat([new Date().getFullYear()]))].sort().map(y=>`<option value="${y}" ${y===npdYear?'selected':''}>${y}</option>`).join('')}
    </select>
    <button class="btn primary" style="font-size:12px;padding:5px 12px;margin-bottom:4px" onclick="openNpdModal(null)">＋ เพิ่มโปรเจกต์</button>
  </div>`;

  let body = "";

  else if(npdSub==="brands") body = npdBrandsView();
  else if(npdSub==="gantt") body = npdGanttView();

  return `<div class="tl-light-wrap">${tabsHtml}${body}</div>`;

function npdDashboard(){
  const all = npdYearProjects();
  const brandPills = `<div class="npd-pills" style="margin-bottom:14px">
    <button class="npd-pill ${!npdBrand?'active':''}" onclick="npdBrand='';render()">ทุกแบรนด์</button>
    ${BRANDS.map(b=>{
      const n=all.filter(p=>p.brand===b.id).length;
      return `<button class="npd-pill ${b.id===npdBrand?'active':''}" onclick="npdBrand='${b.id}';render()">
        <span class="npd-dot" style="background:${b.color}"></span>${esc(b.short.split(' ')[0])}${n?` (${n})`:''}
      </button>`;
    }).join('')}
  </div>`;
  const list = npdBrand ? all.filter(p=>p.brand===npdBrand) : all;
  const total = list.length;
  const launched = list.filter(p=>["launched","completed"].includes(p.status)).length;
  const completed = list.filter(p=>p.status==="completed").length;
  const delayed = list.filter(p=>p.status==="delayed").length;
  const avgAch = total ? Math.round(list.reduce((a,p)=>a+npdAch(p),0)/total) : 0;
  const llist = list.filter(p=>p.actualLaunch);
  const onTime = llist.length ? Math.round(100*llist.filter(npdOnTime).length/llist.length) : 0;

  const tiles = `<div class="npd-tiles">
    ${npdTile("Total Projects", total, npdYear+" · all brands")}
    ${npdTile("Launched", launched, total?Math.round(100*launched/total)+"%  of plan":"—")}
    ${npdTile("Completed", completed, "✅ fully closed")}
    ${npdTile("Avg Achievement", avgAch+"%", "milestone completion")}
    ${npdTile("On-Time Launch", onTime+"%", llist.length?llist.filter(npdOnTime).length+"/"+llist.length+" launches":"no launches yet")}
    ${npdTile("Delayed", delayed, delayed?"⚠️ needs attention":"✅ none")}
  </div>`;

  // Brand bar chart
  const maxCount = Math.max(1,...BRANDS.map(b=>list.filter(p=>p.brand===b.id).length));
  const barChart = `<div class="npd-card">
    <div class="npd-card-title">Projects by Brand</div>
    <div class="npd-card-sub">Project count by status · ${npdYear}</div>
    ${BRANDS.map(b=>{
      const bl = list.filter(p=>p.brand===b.id);
      const segs = NPD_STATUSES.map(s=>{
        const n=bl.filter(p=>p.status===s.id).length; if(!n) return "";
        return `<div class="nhbar-seg" style="flex:${n};background:${NPD_ST_COLS[s.id]}" title="${b.name}: ${s.label} ${n}"></div>`;
      }).join("");
      return `<div class="nhbar-row">
        <div class="nhbar-lbl"><span class="npd-dot" style="background:${b.color}"></span>${esc(b.short.split(' ')[0])}</div>
        <div style="width:${bl.length?Math.max(8,100*bl.length/maxCount):0}%"><div class="nhbar-track" style="border-radius:4px">${segs||'<div style="height:16px;background:var(--line2);border-radius:4px;width:100%"></div>'}</div></div>
        <div class="nhbar-total">${bl.length}</div>
      </div>`;
    }).join("")}
    <div class="npd-legend">
      ${NPD_STATUSES.map(s=>`<span class="li"><span class="sw" style="background:${NPD_ST_COLS[s.id]}"></span>${s.label}</span>`).join('')}
    </div>
  </div>`;

  // Monthly column chart
  const perMonth = NPD_MONTHS.map((_,m)=>{
    const inM = list.filter(p=>+p.launchStart.slice(0,4)===npdYear && +p.launchStart.slice(5,7)-1===m);
    return { done:inM.filter(p=>p.actualLaunch).length, plan:inM.filter(p=>!p.actualLaunch).length };
  });
  const maxM = Math.max(1,...perMonth.map(x=>x.done+x.plan));
  const colChart = `<div class="npd-card">
    <div class="npd-card-title">Launch Schedule by Month</div>
    <div class="npd-card-sub">Planned launch-start month · ${npdYear}</div>
    <div class="npd-col-wrap">
      ${perMonth.map((x,m)=>{
        const hD=100*x.done/maxM, hP=100*x.plan/maxM;
        return `<div class="npd-col" title="${NPD_MONTHS[m]} ${npdYear}: ${x.done+x.plan} projects">
          ${x.plan?`<div class="seg" style="height:${hP}%;background:var(--mut2)"></div>`:''}
          ${x.done?`<div class="seg" style="height:${hD}%;background:var(--blue)"></div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="npd-col-axis">${NPD_MONTHS.map(m=>`<span>${m[0]}</span>`).join('')}</div>
    <div class="npd-legend">
      <span class="li"><span class="sw" style="background:var(--blue)"></span>Launched</span>
      <span class="li"><span class="sw" style="background:var(--mut2)"></span>Planned</span>
    </div>
  </div>`;

  // Brand overview cards
  const brandCards = `<div style="margin-top:16px">
    <div class="section-title"><h2>Brand Overview</h2><span class="count" style="font-size:11px">คลิกเพื่อดูรายละเอียด</span></div>
    <div class="npd-brand-grid">
      ${BRANDS.map(b=>{
        const bl = list.filter(p=>p.brand===b.id);
        const bAch = bl.length ? Math.round(bl.reduce((a,p)=>a+npdAch(p),0)/bl.length) : 0;
        const bLive = bl.filter(p=>["launched","completed"].includes(p.status)).length;
        const bDone = bl.filter(p=>p.status==="completed").length;
        return `<button class="npd-brand-card" style="--pc:${b.color}" onclick="npdSub='brands';npdBrand='${b.id}';render()">
          <div class="nbc-top">
            <span class="nbc-swatch" style="${b.logo?'':'background:'+b.color}">
              ${b.logo?`<img src="${b.logo}" alt="${esc(b.short)}" onerror="this.parentNode.style.background='${b.color}';this.remove()">`:`<span style="color:#fff;font-size:9px;font-weight:800">${esc(b.short.slice(0,2).toUpperCase())}</span>`}
            </span>
            <div><div class="nbc-name">${esc(b.name)}</div><div class="nbc-count">${bl.length} project${bl.length!==1?'s':''} · ${npdYear}</div></div>
          </div>
          <div class="nbc-stats">
            <div class="nbc-stat"><b>${bLive}</b><span>Launched</span></div>
            <div class="nbc-stat"><b>${bDone}</b><span>Done</span></div>
            <div class="nbc-stat"><b>${bAch}%</b><span>Achieve</span></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut2);margin-bottom:4px"><span>Achievement</span><b>${bAch}%</b></div>
          <div class="npd-prog"><i style="width:${bAch}%;background:${b.color}"></i></div>
        </button>`;
      }).join('')}
    </div>
  </div>`;

  return brandPills + tiles + `<div class="npd-charts">${barChart}${colChart}</div>` + (npdBrand ? '' : brandCards);
}

function npdGanttView(){
  const all = npdYearProjects();
  const pills = `<div class="npd-pills">
    <button class="npd-pill ${!npdBrand?'active':''}" onclick="npdBrand='';render()">ทุกแบรนด์</button>
    ${BRANDS.map(b=>{
      const n=all.filter(p=>p.brand===b.id).length;
      return `<button class="npd-pill ${b.id===npdBrand?'active':''}" onclick="npdBrand='${b.id}';render()">
        <span class="npd-dot" style="background:${b.color}"></span>${esc(b.short.split(' ')[0])}${n?` (${n})`:''}
      </button>`;
    }).join('')}
  </div>`;

  const shownBrands = npdBrand ? BRANDS.filter(b=>b.id===npdBrand) : BRANDS;
  const list = npdBrand ? all.filter(p=>p.brand===npdBrand) : all;
  const now = new Date();
  const showToday = now.getFullYear()===npdYear;
  const todayPct = 100*(now.getMonth()+now.getDate()/31)/12;

  let gantt = `<div class="g-header"><span style="text-align:left">โปรเจกต์</span>${NPD_MONTHS.map(m=>`<span>${m}</span>`).join('')}</div>`;
  let hasAny=false;
  for(const b of shownBrands){
    const bl = list.filter(p=>p.brand===b.id).sort((a,c)=>a.launchStart.localeCompare(c.launchStart));
    if(!bl.length) continue;
    hasAny=true;
    const lList=bl.filter(p=>p.actualLaunch), avg=bl.length?Math.round(bl.reduce((a,p)=>a+npdAch(p),0)/bl.length):0;
    gantt += `<div class="g-brand-sep"><span class="npd-dot" style="background:${b.color}"></span>${esc(b.short)} <span style="font-weight:400;color:var(--mut2)">· ${bl.length} projects · avg ${avg}%</span></div>`;
    const today=new Date().toISOString().slice(0,10);
    for(const p of bl){
      const s = +p.launchStart.slice(0,4)<npdYear ? 0 : +p.launchStart.slice(5,7)-1;
      const eRaw = p.launchEnd || (npdYear+"-12");
      const e = +eRaw.slice(0,4)>npdYear ? 11 : +eRaw.slice(5,7)-1;
      const left=100*s/12, width=100*(e-s+1)/12;
      const st=npdStatusOf(p.status);
      const a=npdAch(p);
      const ms=p.milestones||[], msDone=ms.filter(m=>m.done).length;

      // milestone sub-rows — only those with dueDate in npdYear
      const msInYear=ms.filter(m=>m.dueDate&&+m.dueDate.slice(0,4)===npdYear);
      const isExp=npdExpanded.has(p.id);
      const msRows=msInYear.map(m=>{
        const dM=+m.dueDate.slice(5,7)-1;
        const dD=+(m.dueDate.slice(8,10)||'1');
        const duePct=100*(dM+dD/31)/12;
        const bw=Math.max(0,duePct-left);
        const over=!m.done&&m.dueDate<today;
        const col=m.done?'var(--green)':over?'var(--red)':b.color;
        return `<div class="g-ms-row" title="${esc(m.name)}${m.dueDate?' · '+fmtDue(m.dueDate):''}${over?' ⚠️':''}">
          <div class="g-ms-label">
            <span class="g-ms-ic" style="color:${col}">${m.done?'✓':over?'!':'○'}</span>
            <span class="g-ms-name">${esc(m.name)}</span>
            ${m.dept?`<span class="npd-ms-dept" style="font-size:8px;padding:0 4px">${esc(m.dept)}</span>`:''}
          </div>
          <div class="g-ms-cells">
            <div class="g-grid" style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr)">${'<i style="border-left:1px solid var(--line)"></i>'.repeat(12)}</div>
            <div class="g-ms-bar" style="left:${left}%;width:${bw}%;background:${col}"></div>
            <div class="g-ms-dot" style="left:${duePct}%;background:${m.done?col:'#fff'};border-color:${col}"></div>
            ${showToday?`<div class="g-today" style="left:${todayPct}%;opacity:.35"></div>`:''}
          </div>
        </div>`;
      }).join('');

      gantt += `<div class="g-row" onclick="npdShowMilestones('${p.id}')" title="คลิกดู Milestones">
        <div class="g-label">
          ${msInYear.length
            ? `<button class="g-toggle" onclick="npdToggleExpand(event,'${p.id}')" title="${isExp?'ซ่อน':'แสดง'}งานย่อย">${isExp?'▼':'▶'}</button>`
            : `<span style="width:16px;display:inline-block"></span>`}
          <span class="st">${st.ico}</span>${esc(p.theme)}
          ${ms.length?`<span class="g-ms-badge">${msDone}/${ms.length}</span>`:''}
        </div>
        <div class="g-cells">
          <div class="g-grid">${'<i></i>'.repeat(12)}</div>
          <div class="g-bar" style="left:${left}%;width:calc(${width}% - 3px);background:${b.color}"
            title="${esc(p.theme)} · ${npdFmtWin(p)} · ${st.label} · Achievement ${a}%">
            ${st.ico} ${a}%
          </div>
          ${showToday?`<div class="g-today" style="left:${todayPct}%"></div>`:''}
        </div>
      </div>
      ${msInYear.length?`<div id="gms_${p.id}" class="g-ms-rows" style="display:${isExp?'block':'none'}">${msRows}</div>`:''}`;
    }
  }
  if(!hasAny) gantt += `<div class="tl-empty">ไม่มีโปรเจกต์ที่มีวันที่ในปี ${npdYear} — กด ＋ เพิ่มโปรเจกต์</div>`;

  const legend = `<div class="npd-legend">
    ${shownBrands.filter(b=>list.some(p=>p.brand===b.id)).map(b=>`<span class="li"><span class="sw" style="background:${b.color}"></span>${esc(b.short.split(' ')[0])}</span>`).join('')}
    ${NPD_STATUSES.map(s=>`<span class="li">${s.ico} ${s.label}</span>`).join('')}
  </div>`;

  return pills + `<div class="gantt-wrap"><div class="npd-card-title" style="margin-bottom:2px">Launch Timeline</div><div class="npd-card-sub">ปี ${npdYear}</div><div class="gantt-inner" style="min-width:700px">${gantt}</div>${legend}</div>`;
}

function npdToggleMs(id, i){
  const p=(DATA.npd||[]).find(x=>x.id===id); if(!p) return;
  p.milestones[i].done=!p.milestones[i].done;
  if(p.milestones.every(m=>m.done) && ["launched","inprogress"].includes(p.status)){
    p.status="completed"; toast("\""+p.theme+"\" Completed ✅");
  }
  save(); render();
}

        <datalist id="npdDeptList"><option value="R&D"><option value="QA/R&D"><option value="Finance"><option value="Marketing"><option value="Operations"><option value="Supply Chain"><option value="Purchasing"><option value="Training"></datalist>
      </div></div>
    `,
    onSave:()=>{
      const g=id=>document.getElementById(id); const v=id=>g(id).value;
      p.theme=v("np_theme").trim(); if(!p.theme){toast("ใส่ชื่อโปรเจกต์","err");return false;}
      p.brand=v("np_brand"); p.description=v("np_desc"); p.owner=v("np_owner"); p.status=v("np_status");
      const noEndChk=document.getElementById("np_no_end").checked;
      let start=v("np_start"); if(!start){toast("ใส่วันที่ Launch Start","err");return false;}
      let end=noEndChk ? null : (v("np_end")||null);
      if(end && end<start) end=start;
      p.launchStart=start; p.launchEnd=end;
      p.actualLaunch=v("np_actual")||null;
      p.milestones=npdMsDraft.filter(m=>m.name.trim());
      p.images=npdImgDraft;
      if(!DATA.npd) DATA.npd=[];
      const idx=DATA.npd.findIndex(x=>x.id===p.id);
      if(idx>=0) DATA.npd[idx]=p; else DATA.npd.push(p);
      npdYear=+start.slice(0,4);
      save(); render(); toast(isNew?"เพิ่ม NPD Project แล้ว":"บันทึกแล้ว"); return true;
    }
  });
  npdRenderMs(); npdRenderImgs();
  if(id){
    const modal=document.getElementById("modal");
    const foot=modal.querySelector(".modal-foot");
    const delBtn=document.createElement("button");
    delBtn.className="btn"; delBtn.style.cssText="color:var(--red);margin-right:auto";
    delBtn.textContent="🗑 ลบโปรเจกต์";
    delBtn.onclick=()=>{
      if(!confirmDel()) return;
      DATA.npd=(DATA.npd||[]).filter(x=>x.id!==id);
      save(); closeModal(); render(); toast("ลบ NPD Project แล้ว");
    };
    foot.insertBefore(delBtn,foot.firstChild);
  }
}

  wrap.innerHTML=npdMsDraft.map((m,i)=>`
    <div style="display:grid;grid-template-columns:14px 1fr 90px 110px 24px;gap:5px;align-items:center">
      <input type="checkbox" ${m.done?'checked':''} onchange="npdMsDraft[${i}].done=this.checked" style="width:14px;height:14px;accent-color:var(--green)">
      <input type="text" value="${esc(m.name)}" oninput="npdMsDraft[${i}].name=this.value" placeholder="ชื่อ milestone" style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--txt);font-size:12px;width:100%">
      <input type="text" value="${esc(m.dept||'')}" oninput="npdMsDraft[${i}].dept=this.value" placeholder="Dept" list="npdDeptList" style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--txt);font-size:12px;width:100%">
      <input type="date" value="${esc(m.dueDate||'')}" onchange="npdMsDraft[${i}].dueDate=this.value" title="กำหนดเสร็จ" style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--txt);font-size:12px;width:100%">

}
function npdAddMs(){ npdMsDraft.push({name:'',dept:'',done:false,dueDate:''}); npdRenderMs(); }

function npdRenderImgs(){
  const wrap=document.getElementById("np_img_preview"); if(!wrap) return;
  wrap.innerHTML=npdImgDraft.map((img,i)=>`
    <div style="position:relative;width:68px;height:68px">
      <img src="${img.src}" style="width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" title="${esc(img.name)}">
      <button type="button" onclick="npdImgDraft.splice(${i},1);npdRenderImgs()" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;border:none;cursor:pointer;display:grid;place-items:center;padding:0">×</button>
    </div>`).join('');
}
function npdCompressImg(file,maxPx,q){
  return new Promise(resolve=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if(w>maxPx||h>maxPx){ const r=Math.min(maxPx/w,maxPx/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve({src:c.toDataURL('image/jpeg',q||0.72), name:file.name});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src=url;
  });
}
async function npdAddImages(inp){
  const files=[...inp.files];
  for(const f of files){
    const result=await npdCompressImg(f,720,0.72);
    if(result){ npdImgDraft.push(result); npdRenderImgs(); }
  }
  inp.value="";
}

   VIEW: COST RM (raw materials)
   ========================================================================= */
let rmSearch="";

  let rows=DATA.materials;
  if(rmSearch) rows=rows.filter(m=>(m.name+m.code+(m.category||"")).toLowerCase().includes(rmSearch.toLowerCase()));
  const cats=[...new Set(DATA.materials.map(m=>m.category).filter(Boolean))];
  return `
  <div class="toolbar">
    <input class="search" placeholder="🔍 ค้นหาวัตถุดิบ..." value="${esc(rmSearch)}" oninput="rmSearch=this.value;render()"/>
    <div class="spacer"></div>
    <button class="btn primary" onclick="editRM()">＋ เพิ่มวัตถุดิบ</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>รหัส</th><th>วัตถุดิบ</th><th>หมวด</th>
        <th class="num">ราคาซื้อ</th><th class="num">ปริมาณ</th>
        <th class="num">ต้นทุน/หน่วย</th><th class="num">Yield</th><th class="num">ต้นทุนสุทธิ</th><th></th>
      </tr></thead>
      <tbody>
      ${rows.length? rows.map(m=>{
        const base=m.purchaseQty? m.purchasePrice/m.purchaseQty:0;
        const eff=rmCostPerUnit(m);
        return `<tr>
          <td class="mono muted">${esc(m.code||"")}</td>
          <td><b>${esc(m.name)}</b></td>
          <td>${m.category?`<span class="chip">${esc(m.category)}</span>`:'<span class="muted">—</span>'}</td>
          <td class="num mono">฿${baht(m.purchasePrice)}</td>

          <td class="num mono">฿${baht(base)}<div class="muted" style="font-size:10px">/${esc(m.unit)}</div></td>
          <td class="num mono">${pct((m.yieldPercent||1)*100)}</td>
          <td class="num mono"><b>฿${baht(eff)}</b><div class="muted" style="font-size:10px">/${esc(m.unit)}</div></td>
          <td class="num" style="white-space:nowrap">
            <button class="icon-btn" onclick="editRM('${m.id}')">✏️</button>

      }).join("") : emptyRow(9,"🥩","ยังไม่มีวัตถุดิบ — กด “เพิ่มวัตถุดิบ”")}
      </tbody>
    </table>

  <div class="help">💡 ต้นทุน/หน่วย = ราคาซื้อ ÷ ปริมาณ · ต้นทุนสุทธิ (ใช้คำนวณจริง) = ต้นทุน/หน่วย ÷ Yield% (ชดเชยส่วนที่เสีย/ตัดแต่ง)</div>
  `;
}
function delRM(id){
  const used=DATA.menus.some(m=>(m.items||[]).some(i=>i.type==="rm"&&i.ref===id))
    || DATA.boms.some(b=>(b.items||[]).some(i=>i.type==="rm"&&i.ref===id));
  if(used){ toast("วัตถุดิบนี้ถูกใช้ในสูตร/เมนูอยู่ ลบไม่ได้","err"); return; }
  if(!confirmDel()) return;
  DATA.materials=DATA.materials.filter(m=>m.id!==id); save(); render(); toast("ลบวัตถุดิบแล้ว");
}
function editRM(id){
  const isNew=!id;
  const m=id? JSON.parse(JSON.stringify(getMaterial(id))) : {
    id:uid("rm"), code:nextCode("RM",DATA.materials), name:"", category:"",
    unit:"g", purchasePrice:0, purchaseQty:1, purchaseUnit:"kg", yieldPercent:1, notes:""
  };
  openModal({
    title:isNew?"เพิ่มวัตถุดิบ (Cost RM)":"แก้ไขวัตถุดิบ",
    body:`
      <div class="form-row">
        <div class="field"><label>ชื่อวัตถุดิบ *</label><input id="r_name" value="${esc(m.name)}"/></div>
        <div class="field"><label>รหัส</label><input id="r_code" value="${esc(m.code)}"/></div>
      </div>
      <div class="form-row">
        <div class="field"><label>หมวดหมู่</label><input id="r_cat" value="${esc(m.category||"")}" list="catList" placeholder="เช่น เนื้อสัตว์, ผัก"/>
          <datalist id="catList">${[...new Set(DATA.materials.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
        </div>
        <div class="field"><label>หน่วยในสูตร (Recipe unit)</label>${unitSelect("r_unit",m.unit)}<div class="hint">หน่วยที่ใช้ตอนชั่งในสูตร</div></div>
      </div>
      <div class="form-row">
        <div class="field"><label>ราคาซื้อ (บาท) *</label><input id="r_price" type="number" min="0" step="0.01" value="${m.purchasePrice||0}" oninput="rmPreview()"/></div>
        <div class="field"><label>ได้ปริมาณ *</label>
          <div style="display:flex;gap:8px">
            <input id="r_qty" type="number" min="0" step="any" value="${m.purchaseQty||0}" style="flex:1" oninput="rmPreview()"/>
            ${unitSelect("r_punit",m.purchaseUnit)}
          </div>
          <div class="hint">ต่อ 1 ครั้งที่ซื้อในราคาด้านซ้าย (แปลงเป็นหน่วยสูตร)</div>
        </div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Yield % (อัตราใช้ได้จริงหลังตัดแต่ง)</label>
          <input id="r_yield" type="number" min="1" max="100" step="0.1" value="${((m.yieldPercent||1)*100)}" oninput="rmPreview()"/>
          <div class="hint">เช่น เนื้อตัดแต่งเหลือ 85% ให้ใส่ 85 (ใส่ 100 ถ้าใช้ได้หมด)</div>
        </div>
      </div>
      <div class="summary-box" id="rmPreview"></div>
    `,
    onSave:()=>{
      const g=id=>document.getElementById(id);
      m.name=g("r_name").value.trim(); if(!m.name){toast("ใส่ชื่อวัตถุดิบ","err");return false;}
      m.code=g("r_code").value; m.category=g("r_cat").value;
      m.unit=g("r_unit").value;
      m.purchasePrice=parseFloat(g("r_price").value)||0;
      m.purchaseQty=parseFloat(g("r_qty").value)||0;
      m.purchaseUnit=g("r_punit").value;
      m.yieldPercent=(parseFloat(g("r_yield").value)||100)/100;
      const idx=DATA.materials.findIndex(x=>x.id===m.id);
      if(idx>=0)DATA.materials[idx]=m; else DATA.materials.push(m);
      save(); render(); toast("บันทึกวัตถุดิบแล้ว"); return true;
    }
  });
  rmPreview();
}
function rmPreview(){
  const g=id=>document.getElementById(id);
  if(!g("r_price")) return;
  const price=parseFloat(g("r_price").value)||0;
  const qty=parseFloat(g("r_qty").value)||0;
  const y=(parseFloat(g("r_yield").value)||100)/100;
  const unit=g("r_unit").value;
  const base=qty?price/qty:0, eff=y?base/y:0;
  g("rmPreview").innerHTML=`
    <div class="s"><div class="k">ต้นทุน/หน่วย</div><div class="v mono">฿${baht(base)}<span style="font-size:12px;color:var(--mut2)">/${esc(unit)}</span></div></div>
    <div class="s"><div class="k">Yield</div><div class="v mono">${pct(y*100)}</div></div>
    <div class="s"><div class="k">ต้นทุนสุทธิ (ใช้คำนวณ)</div><div class="v mono kpi-warn">฿${baht(eff)}<span style="font-size:12px;color:var(--mut2)">/${esc(unit)}</span></div></div>`;
}

/* =========================================================================
   SHARED UI bits
   ========================================================================= */
function brandSelect(id,sel){
  return `<select id="${id}">${BRANDS.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.short)}</option>`).join("")}</select>`;
}
function projectSelect(id,sel){
  return `<select id="${id}"><option value="">— ไม่มี —</option>${
    DATA.projects.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join("")}</select>`;
}
function unitSelect(id,sel){
  const opts=UNITS.includes(sel)||!sel?UNITS:[sel,...UNITS];
  return `<select id="${id}">${opts.map(u=>`<option ${u===sel?'selected':''}>${esc(u)}</option>`).join("")}</select>`;
}
function emptyRow(cols,ic,msg){
  return `<tr><td colspan="${cols}"><div class="empty"><div class="big">${ic}</div>${msg}</div></td></tr>`;
}
function nextCode(prefix,arr){
  let max=0;
  arr.forEach(x=>{ const m=(x.code||"").match(new RegExp(prefix+"-?0*(\\d+)")); if(m) max=Math.max(max,+m[1]); });
  return prefix+"-"+String(max+1).padStart(3,"0");
}

/* ---------- modal ---------- */
let modalState=null;
function openModal({title,body,onSave,wide}){
  modalState={onSave};
  const m=document.getElementById("modal");
  m.className="modal"+(wide?" wide":"");
  m.innerHTML=`
    <div class="modal-head"><h3>${esc(title)}</h3><div class="spacer" style="flex:1"></div>
      <button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="saveModal()">💾 บันทึก</button>
    </div>`;
  document.getElementById("modalBack").classList.add("open");
}
function closeModal(){ document.getElementById("modalBack").classList.remove("open"); modalState=null; }
function saveModal(){
  try{
    if(modalState&&modalState.onSave){ const ok=modalState.onSave(); if(ok!==false) closeModal(); }
    else closeModal();
  }catch(e){ console.error("saveModal error",e); toast("เกิดข้อผิดพลาด: "+e.message,"err"); }
}
document.getElementById("modalBack").addEventListener("mousedown",e=>{
  if(e.target.id==="modalBack") closeModal();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

}
window.addEventListener("resize",checkMobile);

}
boot();
